<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Describe y adivina</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;

  .wrap { width: 100%; max-width: 420px; padding: 0 20px 40px; }

  /* Header */
  .header { padding: 28px 0 16px; border-bottom: 1px solid #EDEDED; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .count { font-size: 12px; color: #9B9B9B; }

  .lang-switch { display: flex; align-items: center; gap: 6px; }
  .lang-label { font-size: 11px; font-weight: 600; color: #8A8A8A; cursor: pointer; }
  .lang-label.active { color: #1A1A1A; }
  .switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; cursor: pointer; display: inline-block; }
  .switch-track { position: absolute; inset: 0; background: #E4E4E4; border-radius: 19px; transition: background 0.15s ease; }
  .switch-track.checked { background: #1A1A1A; }
  .switch-knob { position: absolute; width: 14px; height: 14px; left: 2.5px; top: 2.5px; background: #FFFFFF; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: left 0.15s ease; }
  .switch-knob.checked { left: 17.5px; }

  .mode-row { display: flex; gap: 4px; }
  .mode-btn {
    flex: 1; padding: 9px 0; font-size: 13px; font-weight: 500; font-family: inherit;
    border: none; border-bottom: 2px solid #EDEDED; background: none; color: #9B9B9B; cursor: pointer;
  }
  .mode-btn.active { border-bottom: 2px solid #1A1A1A; color: #1A1A1A; }

  /* Help */
  .help-toggle {
    width: 100%; margin-top: 12px; padding: 8px 0; font-size: 12px; font-family: inherit;
    background: none; border: none; color: #9B9B9B; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .help-toggle .chevron { display: inline-block; font-size: 10px; transition: transform 0.15s ease; }
  .help-toggle .chevron.open { transform: rotate(180deg); }
  .help-panel {
    margin-top: 4px; margin-bottom: 8px; padding: 16px; background: #FAFAFA;
    border: 1px solid #EDEDED; border-radius: 8px; font-size: 13px; line-height: 1.6; color: #4A4A4A;
    display: none;
  }
  .help-panel.open { display: block; }
  .help-panel p { margin: 0 0 10px; }
  .help-panel p:last-child { margin-bottom: 0; }

  /* Repaso flip card */
  .card-outer { margin-top: 40px; margin-bottom: 32px; perspective: 1400px; cursor: pointer; }
  .card-inner {
    position: relative; min-height: 160px;
    transition: transform 0.5s cubic-bezier(.45,.1,.15,1);
    transform-style: preserve-3d;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .card-back { transform: rotateY(180deg); }
  .word-row { display: inline-flex; align-items: center; gap: 8px; }
  .word { font-size: 36px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; word-break: break-word; }
  .info-btn {
    width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; border: 1px solid #C9C9C9;
    background: #FFFFFF; color: #9B9B9B; font-size: 11px; font-style: italic; font-family: Georgia, serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    line-height: 1; align-self: flex-start; margin-top: 2px;
  }
  .info-btn.active { background: #F1ECFB; color: #6B4FC4; border-color: #B9A3EA; }
  .card-sub { margin-top: 14px; min-height: 18px; }
  .card-sub .cat-text { font-size: 12px; color: #9B9B9B; text-transform: lowercase; }
  .card-sub .hint { font-size: 12px; color: #C9C9C9; }
  .translation { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; color: #7C5CBF; word-break: break-word; }
  .empty-state { min-height: 160px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #9B9B9B; }

  .primary-btn {
    width: 100%; padding: 13px; font-size: 14px; font-weight: 500; font-family: inherit;
    border: 1px solid #1A1A1A; border-radius: 6px; background: #1A1A1A; color: #FFFFFF; cursor: pointer;
  }
  .primary-btn:disabled { background: #F5F5F5; color: #B5B5B5; border-color: #EDEDED; cursor: default; }

  .nav-row { display: flex; gap: 8px; }
  .nav-row .primary-btn { flex: 1; width: auto; }
  .back-btn {
    width: 46px; flex-shrink: 0; padding: 13px 0; font-size: 16px; font-family: inherit;
    border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF; color: #1A1A1A; cursor: pointer;
  }
  .back-btn:disabled { color: #D5D5D5; cursor: default; }

  /* Juego */
  .duration-label { font-size: 12px; color: #9B9B9B; margin-bottom: 10px; }
  .duration-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .duration-btn {
    flex: 1 1 auto; min-width: 80px; padding: 9px 0; font-size: 13px; font-family: inherit;
    border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF; color: #9B9B9B; cursor: pointer;
  }
  .duration-btn.active { border: 1px solid #B9A3EA; background: #F1ECFB; color: #6B4FC4; }
  .warn { margin-top: 10px; font-size: 12px; color: #B5533C; }

  .game-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 12px; color: #9B9B9B; }
  .game-topbar strong { color: #1A1A1A; }
  .link-btn { background: none; border: none; color: #9B9B9B; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; font-family: inherit; }
  .timer { font-variant-numeric: tabular-nums; }

  .game-word-block { text-align: center; margin-bottom: 28px; }
  .game-word-label { font-size: 12px; color: #9B9B9B; margin-bottom: 10px; }
  .game-word { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; word-break: break-word; text-transform: uppercase; margin-bottom: 10px; }
  .game-word-meta { font-size: 12px; color: #C9C9C9; margin-bottom: 16px; }
  .game-word-meta .cat-text { text-transform: lowercase; }
  .game-explain { font-size: 14px; color: #6B6B6B; }

  .game-actions { display: flex; flex-direction: column; gap: 8px; }
  .btn-guessed { width: 100%; padding: 15px; font-size: 15px; font-weight: 600; font-family: inherit; border: 1px solid #1A1A1A; border-radius: 6px; background: #1A1A1A; color: #FFFFFF; cursor: pointer; }
  .btn-guessed:disabled { background: #F5F5F5; color: #B5B5B5; cursor: default; }
  .btn-pass { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; font-family: inherit; border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF; color: #6B6B6B; cursor: pointer; }
  .end-early { width: 100%; margin-top: 14px; padding: 8px 0; font-size: 12px; font-family: inherit; background: none; border: none; color: #C9C9C9; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  .finished-block { margin-top: 40px; margin-bottom: 24px; text-align: center; }
  .finished-label { font-size: 13px; color: #9B9B9B; margin-bottom: 18px; }
  .finished-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 32px; }
  .finished-stat-num { font-size: 28px; font-weight: 600; }
  .finished-stat-label { font-size: 12px; color: #9B9B9B; }

  /* Vocabulario / tipo de palabra */
  .section { margin-top: 28px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-label { font-size: 12px; color: #9B9B9B; }
  .toggle-all { background: none; border: none; color: #1A1A1A; font-size: 12px; font-family: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .level-btn { flex: 1; padding: 9px 0; font-size: 13px; font-family: inherit; border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF; color: #9B9B9B; cursor: pointer; }
  .level-btn.active { border: 1px solid #B9A3EA; background: #F1ECFB; color: #6B4FC4; }
  .type-btn { padding: 7px 12px; font-size: 13px; font-family: inherit; border: 1px solid #E5E5E5; border-radius: 6px; background: #FFFFFF; color: #9B9B9B; cursor: pointer; }

  .filters-toggle {

  .filters-panel { margin-top: 8px; border-top: 1px solid #EDEDED; padding-top: 20px; display: none; }
  .filters-panel.open { display: block; }
  .cat-list { display: flex; flex-direction: column; }
  .cat-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; color: #9B9B9B; cursor: pointer; border-bottom: 1px solid #F5F5F5; }
  .cat-item.active { color: #1A1A1A; }

  .cat-item.active .box { border: 1px solid #B9A3EA; background: #F1ECFB; }
  .cat-item .box .check { font-size: 10px; color: #6B4FC4; line-height: 1; display: none; }
  .cat-item.active .box .check { display: inline; }
  .cat-item .cat-label { text-transform: lowercase; }
</style>

function categoryLabel(cat, lang) {
  return lang === "en" ? (CATEGORY_EN[cat] || cat) : cat;
}
function typeLabel(type, t) {
  if (type === "Sustantivo") return t.typeNoun;
  if (type === "Verbo") return t.typeVerb;
  if (type === "Adjetivo") return t.typeAdjective;
  if (type === "Expresión") return t.typeExpression;
  return type;
}
function levelLabelFn(level, t) {
  if (level === 1) return t.levelBasic;
  if (level === 2) return t.levelIntermediate;
  return t.levelAdvanced;
}
function pickRandom(pool, exclude) {
  if (pool.length === 0) return null;
  if (pool.length === 1) return pool[0];
  let choice;
  do { choice = pool[Math.floor(Math.random() * pool.length)]; } while (choice.word === exclude);
  return choice;
}
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// Juego state

let gameGuessed = 0;
let gamePassed = 0;
let gameIntervalId = null;

function t() { return UI[lang]; }

function getPool() {
  return VOCAB.filter(w =>
    levels.has(w.level) &&
    selectedTypes.has(w.type) &&
    (w.type !== "Sustantivo" || selectedCats.has(w.category))
  );
}

/* ---------------- render: header ---------------- */
function renderHeader() {
  document.getElementById('appTitle').textContent = t().appTitle;
  document.getElementById('poolCount').textContent = t().wordsCount(getPool().length);
  document.getElementById('modeGameBtn').textContent = t().modeGame;
  document.getElementById('modeReviewBtn').textContent = t().modeReview;
  document.getElementById('modeGameBtn').classList.toggle('active', mode === 'juego');
  document.getElementById('modeReviewBtn').classList.toggle('active', mode === 'repaso');

  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('langEs').classList.toggle('active', lang === 'es');
  const checked = lang === 'es';
  document.getElementById('switchTrack').classList.toggle('checked', checked);
  document.getElementById('switchKnob').classList.toggle('checked', checked);
}

document.getElementById('modeGameBtn').onclick = () => { mode = 'juego'; renderAll(); };
document.getElementById('modeReviewBtn').onclick = () => { mode = 'repaso'; renderAll(); };
document.getElementById('langEn').onclick = () => { lang = 'en'; renderAll(); };
document.getElementById('langEs').onclick = () => { lang = 'es'; renderAll(); };
document.getElementById('langSwitchBtn').onclick = () => { lang = (lang === 'es' ? 'en' : 'es'); renderAll(); };

/* ---------------- render: help ---------------- */

  document.getElementById('helpToggleLabel').textContent = t().howToUse;
  document.getElementById('helpChevron').classList.toggle('open', showHelp);
  document.getElementById('helpPanel').classList.toggle('open', showHelp);

  document.getElementById('helpP4').textContent = t().helpP4;

/* ---------------- render: vocabulary levels ---------------- */
function renderLevels() {
  document.getElementById('vocabLabel').textContent = t().vocabulary;
  const row = document.getElementById('levelRow');
  row.innerHTML = '';
  [[1, t().levelBasic], [2, t().levelIntermediate], [3, t().levelAdvanced]].forEach(([lvl, label]) => {
    const btn = document.createElement('button');
    btn.className = 'level-btn' + (levels.has(lvl) ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => {
      if (levels.has(lvl)) levels.delete(lvl); else levels.add(lvl);
      renderAll();
    };
    row.appendChild(btn);
  });
  const warn = document.getElementById('levelWarn');
  warn.textContent = t().chooseLevel;
  warn.style.display = levels.size === 0 ? 'block' : 'none';
}

/* ---------------- render: type filter ---------------- */
function renderTypes() {
  document.getElementById('typeLabel').textContent = t().wordType;
  const allSel = selectedTypes.size === TYPES.length;
  document.getElementById('toggleAllTypes').textContent = allSel ? t().none : t().all;
  document.getElementById('toggleAllTypes').onclick = () => {
    selectedTypes = allSel ? new Set() : new Set(TYPES);
    renderAll();
  };
  const row = document.getElementById('typeRow');
  row.innerHTML = '';
  TYPES.forEach(ty => {
    const btn = document.createElement('button');
    btn.className = 'type-btn' + (selectedTypes.has(ty) ? ' active' : '');
    btn.textContent = typeLabel(ty, t());
    btn.onclick = () => {
      if (selectedTypes.has(ty)) selectedTypes.delete(ty); else selectedTypes.add(ty);
      renderAll();
    };
    row.appendChild(btn);
  });
  const warn = document.getElementById('typeWarn');
  warn.textContent = t().chooseType;
  warn.style.display = selectedTypes.size === 0 ? 'block' : 'none';
}

  document.getElementById('filtersChevron').classList.toggle('open', showFilters);

  document.getElementById('toggleAllCats').onclick = () => {
    selectedCats = allSel ? new Set() : new Set(CATEGORIES);
    renderAll();
  };

  const list = document.getElementById('catList');
  list.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const active = selectedCats.has(cat);
    const item = document.createElement('label');
    item.className = 'cat-item' + (active ? ' active' : '');
    item.innerHTML = '<span class="box"><span class="check">&#10003;</span></span><span class="cat-label">' + categoryLabel(cat, lang) + '</span>';
    item.onclick = () => {
      if (selectedCats.has(cat)) selectedCats.delete(cat); else selectedCats.add(cat);
      renderAll();
    };
    list.appendChild(item);
  });

  const warn = document.getElementById('catWarn');
  warn.textContent = t().chooseCategory;
  warn.style.display = selectedCats.size === 0 ? 'block' : 'none';
}
document.getElementById('filtersToggle').onclick = () => { showFilters = !showFilters; renderCategories(); };

/* ---------------- Repaso ---------------- */
function renderRepaso() {
  const pool = getPool();
  const curCheck = repasoHistory[repasoPointer];
  if (repasoHistory.length === 0 || !curCheck || !pool.some(w => w.word === curCheck.word)) {
    const w = pickRandom(pool, null);
    repasoHistory = w ? [w] : [];
    repasoPointer = 0;
    repasoFlipped = false;
    repasoShowCategory = false;
  }

  const area = document.getElementById('modeArea');
  const cur = repasoHistory[repasoPointer] || null;
  const canGoBack = repasoPointer > 0;

  if (!cur) {
    area.innerHTML = '<div class="empty-state">' + t().selectAtLeastOne + '</div>' +
      '<button class="primary-btn" disabled>' + t().nextWord + '</button>';
    return;
  }

  const subHtml = repasoShowCategory
    ? '<span class="cat-text">' + (cur.type === 'Sustantivo' ? categoryLabel(cur.category, lang) : typeLabel(cur.type, t())) + '</span>'
    : '<span class="hint">' + t().tapToTranslate + '</span>';

  area.innerHTML = `
    <div class="card-outer" id="cardOuter">
      <div class="card-inner${repasoFlipped ? ' flipped' : ''}" id="cardInner">
        <div class="card-face">
          <div class="word-row">
            <span class="word">${cur.word}</span>
            <button class="info-btn${repasoShowCategory ? ' active' : ''}" id="infoBtn" aria-label="${t().showCategory}">i</button>
          </div>
          <div class="card-sub">${subHtml}</div>
        </div>
        <div class="card-face card-back">
          <span class="translation">${cur.translation}</span>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="back-btn" id="prevWordBtn" ${canGoBack ? '' : 'disabled'} aria-label="${t().previousWord}">&#8249;</button>
      <button class="primary-btn" id="nextWordBtn">${t().nextWord}</button>
    </div>
  `;

  document.getElementById('cardOuter').onclick = () => {
    repasoFlipped = !repasoFlipped;
    renderRepaso();
  };
  document.getElementById('infoBtn').onclick = (e) => {
    e.stopPropagation();
    repasoShowCategory = !repasoShowCategory;
    renderRepaso();
  };
  document.getElementById('prevWordBtn').onclick = () => {
    if (repasoPointer <= 0) return;
    repasoFlipped = false;
    repasoShowCategory = false;
    repasoPointer -= 1;
    renderRepaso();
  };
  document.getElementById('nextWordBtn').onclick = () => {
    repasoFlipped = false;
    repasoShowCategory = false;
    if (repasoPointer < repasoHistory.length - 1) {
      repasoPointer += 1;
    } else {
      const w = pickRandom(pool, cur ? cur.word : null);
      if (w) {
        repasoHistory.push(w);
        repasoPointer += 1;
      }
    }
    renderRepaso();
  };
}

/* ---------------- Juego ---------------- */
function clearGameTimer() {
  if (gameIntervalId) { clearInterval(gameIntervalId); gameIntervalId = null; }
}

function startGame() {
  const pool = getPool();
  gameGuessed = 0;
  gamePassed = 0;
  gameCurrent = pickRandom(pool, null);
  if (gameDuration) {
    gameTimeLeft = gameDuration;
    gameIntervalId = setInterval(() => {
      gameTimeLeft = gameTimeLeft > 0 ? gameTimeLeft - 1 : 0;
      if (gameTimeLeft === 0) {
        clearGameTimer();
        gameStage = 'finished';
      }
      renderJuego();
    }, 1000);
  } else {
    gameTimeLeft = null;
  }
  gameStage = 'playing';
  renderJuego();
}

function endGame() {
  clearGameTimer();
  gameStage = 'finished';
  renderJuego();
}

function gameNextWord() {
  const pool = getPool();
  gameCurrent = pickRandom(pool, gameCurrent ? gameCurrent.word : null);
}

function renderJuego() {
  const area = document.getElementById('modeArea');
  const pool = getPool();

  if (gameStage === 'setup') {
    area.innerHTML = `
      <div style="margin-top:32px;margin-bottom:8px;">
        <div class="duration-label">${t().duration}</div>
        <div class="duration-row" id="durationRow"></div>
        <button class="primary-btn" id="startGameBtn" ${pool.length === 0 ? 'disabled' : ''}>${t().startGame}</button>
        <p class="warn" id="setupWarn" style="display:${pool.length === 0 ? 'block' : 'none'};">${t().selectAtLeastOneFilter}</p>
      </div>
    `;
    const row = document.getElementById('durationRow');
    [null, ...DURATIONS].forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'duration-btn' + (gameDuration === d ? ' active' : '');
      btn.textContent = d === null ? t().noTimeLimit : t().min(d / 60);
      btn.onclick = () => { gameDuration = d; renderJuego(); };
      row.appendChild(btn);
    });
    document.getElementById('startGameBtn').onclick = startGame;
    return;
  }

  if (gameStage === 'finished') {
    area.innerHTML = `
      <div class="finished-block">
        <div class="finished-label">${gameDuration ? t().timeUp : t().gameOver}</div>
        <div class="finished-stats">
          <div>
            <div class="finished-stat-num">${gameGuessed}</div>
            <div class="finished-stat-label">${t().guessedLower}</div>
          </div>
          <div>
            <div class="finished-stat-num">${gamePassed}</div>
            <div class="finished-stat-label">${t().passedLower}</div>
          </div>
        </div>
        <button class="primary-btn" id="playAgainBtn">${t().playAgain}</button>
      </div>
    `;
    document.getElementById('playAgainBtn').onclick = () => { gameStage = 'setup'; renderJuego(); };
    return;
  }

  // playing
  const wordBlock = gameCurrent ? `
    <div class="game-word-block">
      <div class="game-word-label">${t().yourWord}</div>
      <div class="game-word">${gameCurrent.word}</div>
      <div class="game-word-meta">
        <span class="cat-text">${gameCurrent.type === 'Sustantivo' ? categoryLabel(gameCurrent.category, lang) : typeLabel(gameCurrent.type, t())}</span>
        &nbsp;&middot;&nbsp;${levelLabelFn(gameCurrent.level, t())}
      </div>
      <div class="game-explain">${t().explain}</div>
    </div>
  ` : `<div class="game-word-block" style="font-size:14px;color:#9B9B9B;">${t().noWordsFiltered}</div>`;

  area.innerHTML = `
    <div style="margin-top:24px;margin-bottom:8px;">
      <div class="game-topbar">
        <span>${t().guessed}: <strong>${gameGuessed}</strong>&nbsp;&nbsp;&middot;&nbsp;&nbsp;${t().passed}: <strong>${gamePassed}</strong></span>
        ${gameDuration
          ? `<span class="timer">${formatTime(gameTimeLeft)}</span>`
          : `<button class="link-btn" id="endGameBtn">${t().end}</button>`}
      </div>
      ${wordBlock}
      <div class="game-actions">
        <button class="btn-guessed" id="guessedBtn" ${!gameCurrent ? 'disabled' : ''}>${t().theyGuessedIt}</button>
        <button class="btn-pass" id="passBtn" ${!gameCurrent ? 'disabled' : ''}>${t().pass}</button>
      </div>
      ${gameDuration ? `<button class="end-early" id="endEarlyBtn">${t().endEarly}</button>` : ''}
    </div>
  `;

  if (!gameDuration) {
    document.getElementById('endGameBtn').onclick = endGame;
  } else {
    document.getElementById('endEarlyBtn').onclick = endGame;
  }
  document.getElementById('guessedBtn').onclick = () => { gameGuessed++; gameNextWord(); renderJuego(); };
  document.getElementById('passBtn').onclick = () => { gamePassed++; gameNextWord(); renderJuego(); };
}

/* ---------------- master render ---------------- */
function renderAll() {
  renderHeader();
  renderHelp();
  if (mode === 'repaso') {
    renderRepaso();
  } else {
    renderJuego();
  }
  renderLevels();
  renderTypes();
  renderCategories();
}

renderAll();
</script>
