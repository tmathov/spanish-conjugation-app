<style>
/* Layout: a single reading column; the book's "hilo" (thread) runs across the top as the session map, each knot a session that unlocks in order. */
:root {
  --paper: #F2F8FA;

    --paper: #0F1A1F; --surface: #15242B; --ink: #E3EEF1; --muted: #93A9B1; --line: #24363E; --accent: #5CC3D4; --accent-soft: #163038; --thread: #B3A6F2; --pop: #4A3F86; --pop-ink: #ECE8FF; --locked: #4E6169; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1A1F; --surface: #15242B; --ink: #E3EEF1; --muted: #93A9B1; --line: #24363E; --accent: #5CC3D4; --accent-soft: #163038; --thread: #B3A6F2; --pop: #4A3F86; --pop-ink: #ECE8FF; --locked: #4E6169; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.6; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 1.25rem; padding-block: 2.5rem 4rem; }

.knot { display: flex; flex-direction: column; align-items: center; gap: .3rem; position: relative; z-index: 1; }
.knot button { width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--muted);
  font-family: var(--mono); font-size: .85rem; cursor: pointer; display: grid; place-items: center; }
.knot.done button { border-color: var(--pop); background: var(--pop); color: var(--pop-ink); }
.knot.open button { border-color: var(--line); color: var(--ink); }
.knot.current button { box-shadow: 0 0 0 4px var(--accent-soft); border-color: var(--accent); background: var(--accent); color: var(--surface); font-weight: 600; }

.session-head { border-top: 1px solid var(--line); padding-top: 1.5rem; }
h2 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.1; margin: .3rem 0 .6rem; text-wrap: balance; }

.voices div { background: var(--surface); padding: .9rem 1rem; min-width: 0; }

.video { display: flex; gap: .9rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; text-decoration: none; color: var(--ink); margin: .5rem 0 1rem; }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .93rem; }
th { text-align: left; font-family: var(--mono); font-weight: 500; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
td { padding: .55rem .8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; white-space: nowrap; }
td.en { color: var(--muted); font-style: italic; }
@media (max-width: 520px) { td:first-child { white-space: normal; } }

.qs { display: grid; gap: .6rem; counter-reset: q; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details summary { list-style: none; cursor: pointer; padding: .85rem 1rem .85rem 3rem; position: relative; font-weight: 600; }
details summary::-webkit-details-marker { display: none; }
.qs details summary::before { counter-increment: q; content: counter(q); position: absolute; left: 1rem; top: .85rem; font-family: var(--mono); font-weight: 500; font-size: .85rem; color: var(--thread); }
details summary .hint { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); font-family: var(--mono); margin-top: .2rem; }
details[open] summary .hint .closed, details:not([open]) summary .hint .opened { display: none; }
details .ans { padding: 0 1rem 1rem 3rem; border-top: 1px dashed var(--line); padding-top: .8rem; }
details .ans p:last-child { margin-bottom: 0; }

.gram { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem; }
.gram .ex { border-left: 2px solid var(--thread); padding: .2rem 0 .2rem .9rem; margin: .8rem 0; }
.gram .ex p { margin: 0 0 .3rem; }
.gram .ex .arrow { color: var(--muted); font-size: .92rem; }
.practice { display: grid; gap: .5rem; margin-top: 1rem; }
.practice details summary { padding-left: 1rem; font-weight: 400; }
.practice details .ans { padding-left: 1rem; }

.unlock { margin-top: 3rem; padding: 1.3rem 1.2rem; border: 0; background: var(--accent-soft); border-radius: 14px; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
.unlock p { margin: 0; flex: 1 1 18rem; }
button.btn { font: 600 .95rem var(--body); background: var(--accent); color: #FFFFFF; border: 0; padding: .7rem 1.2rem; border-radius: 99px; cursor: pointer; }
button.btn:disabled { background: var(--locked); cursor: default; }

.lockedview { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.lockedview h2 { color: var(--ink); }

/* v2 steps */
.step { margin-top: 3rem; }
.step-head { display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; align-items: baseline; margin-bottom: 1rem; }
.step-n { grid-row: span 2; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--pop); color: var(--pop-ink); font-family: var(--display); font-weight: 600; font-size: 1.15rem; display: grid; place-items: center; align-self: center; }
.step-head h3 { margin: 0; }
.step-head h3::after { display: none; }
.step-head .doing { margin: 0; color: var(--muted); font-size: .95rem; }
.step-title { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin: 0; }
.time { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .6rem; margin: 1rem 0; }
.facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .7rem .8rem; font-size: .9rem; min-width: 0; }
.facts b { display: block; font-family: var(--mono); font-weight: 500; font-size: .72rem; letter-spacing: .08em; color: var(--thread); }
.layers { display: grid; gap: .6rem; margin: 1rem 0; }
.layer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; display: grid; grid-template-columns: 7.5rem 1fr; gap: .3rem 1rem; }
.layer.now { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.layer .when { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.layer .when strong { display: block; font-size: .95rem; color: var(--ink); letter-spacing: 0; text-transform: none; font-family: var(--display); font-weight: 400; margin-top: .15rem; }
.layer .what { min-width: 0; }
.layer .what p { margin: 0 0 .4rem; }
.layer .clue { font-size: .88rem; color: var(--muted); }
.layer .clue b { color: var(--accent); font-weight: 600; }
.sample { font-size: .92rem; border-left: 2px solid var(--line); padding-left: .7rem; margin-top: .4rem; }
@media (max-width: 560px) { .layer { grid-template-columns: 1fr; } }
.look { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }
.rp { font-family: var(--mono); font-size: .62rem; letter-spacing: .06em; color: var(--thread); border: 1px solid var(--thread); border-radius: 3px; padding: 0 .25rem; margin-left: .35rem; vertical-align: .1em; }
td .quote { display: block; font-weight: 400; font-style: italic; color: var(--muted); font-size: .85rem; white-space: normal; margin-top: .15rem; }
.moment summary { padding-left: 1rem; font-weight: 400; }
.moment summary q { font-family: var(--display); font-size: 1.15rem; quotes: "“" "”"; }
.moment summary .pg { display: block; font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-top: .2rem; }
.moment .ans { padding-left: 1rem; }
.ans blockquote { margin: 0 0 .6rem; font-style: italic; color: var(--muted); border-left: 2px solid var(--thread); padding-left: .7rem; }
.ans .why { font-size: .9rem; color: var(--muted); }
.ans .why b { color: var(--thread); font-weight: 600; }
.c1 { margin-top: 1rem; border: 1px dashed var(--accent); border-radius: 14px; padding: .9rem 1rem; }
.c1 .tag { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
.notebook { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem; }
.notebook ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .7rem; }
.notebook li span { display: block; color: var(--muted); font-size: .9rem; }
.vosbox { margin: 1rem 0; }
.vosbox summary { padding-left: 1rem; }
.vosbox .ans { padding-left: 1rem; }
.vosbox td:first-child { white-space: normal; }
.cover { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 1.6rem; align-items: start; border-top: 1px solid var(--line); padding-top: 1.5rem; }
.cover img { width: 100%; height: auto; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.cover .txt { min-width: 0; }
@media (max-width: 620px) { .cover { grid-template-columns: 1fr; } .cover img { max-width: 12rem; } }
.ready { margin-top: 2.5rem; padding: 1.4rem 1.3rem; border-radius: 14px; background: var(--accent-soft); display: grid; gap: .8rem; }
.ready h3 { margin: 0; color: var(--accent); }
.ready h3::after { display: none; }
.ready p { margin: 0; }
.reading-box { margin-top: 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: .8rem 1rem; display: grid; gap: .35rem; font-size: .95rem; }
.reading-box .top { display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: baseline; }
.reading-box .lbl { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-block; min-width: 4.8rem; }
.reading-box .hintline { color: var(--muted); font-size: .88rem; }
.oldnote { margin-top: 1.5rem; font-size: .85rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; padding: .6rem .9rem; }
.teacher { margin-top: 3.5rem; display: flex; justify-content: flex-end; gap: .6rem; align-items: center; font-size: .82rem; color: var(--muted); }
.teacher input { accent-color: var(--accent); width: 1rem; height: 1rem; }
@media (prefers-reduced-motion: reduce) { .thread .fill { transition: none; } }
.recap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .8rem 1rem; font-size: .95rem; }
.recap b { font-family: var(--mono); font-weight: 500; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--thread); display: block; margin-bottom: .2rem; }

<div class="wrap">
  <header>
    <p class="eyebrow">Club de lectura · Español C1</p>
    <h1>Distancia de rescate</h1>
    <p class="byline">Samanta Schweblin · 2014 · 8 sesiones</p>
  </header>

  <div class="thread" aria-label="Sesiones del club">
    <div class="fill" id="fill"></div>
    <ol id="knots"></ol>
  </div>

  <main id="session" aria-live="polite"></main>


</div>

<script>
const VIDEO = "https://www.youtube.com/shorts/MPnhEZKENRM";

const S = [
{ n:1, title:"La historia de Carla", from:0, to:11, pages:"pp. 1–13",
  until:"“Lo llamo ‘distancia de rescate’…”", start:"Son como gusanos.", end:"…aunque siempre arriesgo más de lo que debería.", endHint:"Amanda explica qué es la distancia de rescate.",
  intro:true,
  vocab:[
   ["la reposera","silla plegable para tomar sol","deck chair"],
   ["las ojotas","sandalias de goma","flip-flops"],
   ["la pileta","piscina","swimming pool"],
   ["el rodete","pelo recogido en forma de bola","bun (hair)"],
   ["el jardinero de jean","pantalón con peto y tirantes","denim overalls"],
   ["el pasto","hierba, césped","grass, lawn"],
   ["llevar a upa","llevar en brazos","to carry in your arms"],
   ["la guita","el dinero (coloquial)","cash, dough"],
   ["pegarla","tener éxito","to hit the jackpot"],
   ["mis viejos","mis padres","my folks"],
   ["el padrillo / la yegua / el potrillo","caballo semental / hembra / caballo joven","stud / mare / foal"],
   ["pispiar","mirar de reojo, vigilar","to peek, keep an eye on"],
   ["avivarse","darse cuenta","to wise up, realize"],
   ["el riachuelo","río pequeño","stream, creek"],
   ["acuclillarse","agacharse sobre los talones","to squat, crouch"],
   ["la guardia","urgencias de un hospital","ER"]],
  qs:[
   ["¿Quiénes hablan al comienzo y en qué situación están?",
    "Amanda está en una cama, a oscuras, y cree que va a morir pronto. Le habla al oído David, el hijo de Carla. Toda la novela es esta conversación: David le pide que recuerde lo que pasó en los últimos días."],
   ["¿Qué buscan Amanda y David?",
    "“El punto exacto en el que nacen los gusanos”: el momento en que algo entró en el cuerpo de Amanda. Por eso David le pide detalles y le dice qué es importante y qué no."],
   ["¿Qué relación tienen Amanda y Carla?",
    "Son vecinas en el pueblo y se hicieron amigas en pocos días. Amanda siente fascinación por Carla, que le parece hermosa y elegante, pero también momentos de rechazo."],
   ["¿Qué le pasó a David cuando era chico?",
    "Mientras Carla recuperaba un caballo escapado, David metió las manos en el agua del riachuelo, junto a un pájaro muerto. Al día siguiente el caballo estaba agonizando y Carla entendió que su hijo también se había intoxicado."],
   ["¿Qué es la “distancia de rescate”?",
    "Es la distancia variable que separa a Amanda de su hija Nina. Amanda la calcula todo el tiempo: cuánto tardaría en llegar hasta Nina si pasara algo. Es el título del libro y una de sus ideas centrales."]],
  gram:{ title:"Condicionales coloquiales con imperfecto",
   expl:"En el habla, sobre todo en el Río de la Plata, a veces se usa el <strong>imperfecto de indicativo</strong> en las dos partes de una condicional irreal, en lugar de <em>hubiera</em> + participio y <em>habría</em> + participio.",
   ex:[["“Si te perdía, perdía también la casa.”","= Si te hubiera perdido, habría perdido también la casa."],
       ["“Qué no daría ahora porque a David simplemente le faltara un dedo.”","Deseo imposible: <em>qué no daría (yo) por / porque</em> + imperfecto de subjuntivo."]],
   practice:[["Pásalo a la forma estándar: «Si me avisabas, te pasaba a buscar.»","Si me hubieras avisado, te habría pasado a buscar."],
             ["Pásalo a la forma estándar: «Si no llovía ese día, íbamos al lago.»","Si no hubiera llovido ese día, habríamos ido al lago."],
             ["Completa: «Qué no daría porque mi hermano ______ (vivir) más cerca.»","Qué no daría porque mi hermano viviera más cerca."]]}},

{ n:2, title:"La casa verde", recap:"Amanda está en una cama, en la salita, y cree que va a morir. David, el hijo de Carla, le pide que recuerde lo que pasó. Amanda recuerda la historia de Carla: cuando David tenía tres años, tocó el agua de un riachuelo donde había un pájaro muerto y se intoxicó.", hook:"Carla todavía no terminó su historia. Una casa en el pueblo, una mujer que dice que puede ver la energía de las personas. ¿Qué es capaz de hacer una madre para salvar a su hijo?", from:11, to:24, pages:"pp. 14–29", until:"“…Nina me suelta.”", start:"—Cuando decidí qué hacer no hubo vuelta atrás…", end:"…¿Dónde está Nina ahora, David? Necesito saberlo.", endHint:"Carla sale del coche y se va. Nina suelta la mano de Amanda.",
  vocab:[
   ["el pucho","el cigarrillo (coloquial)","smoke, cigarette"],
   ["el cenicero","recipiente para la ceniza","ashtray"],
   ["leer la energía","percibir la salud o el mal de alguien","to read someone’s energy"],
   ["la (tras)migración","paso del espíritu de un cuerpo a otro","(trans)migration of the soul"],
   ["la palangana","recipiente ancho y bajo para agua","basin"],
   ["el hilo sisal","cuerda áspera de fibra vegetal","sisal twine"],
   ["el umbral","la entrada de una puerta","doorway, threshold"],
   ["trastabillar","tropezar al caminar","to stumble"],
   ["tantear","tocar algo para reconocerlo sin ver","to feel one’s way"],
   ["bostezar","abrir la boca por sueño o cansancio","to yawn"],
   ["una barbaridad","algo absurdo o escandaloso","nonsense, an outrage"],
   ["la ligustrina","arbustos que forman un cerco","privet hedge"],
   ["el pasador","pestillo de una puerta","latch, bolt"]],
  qs:[
   ["¿Qué es la casa verde y por qué la gente del pueblo va allí?",
    "Es la casa de una mujer que dice que puede “leer la energía” de las personas y curar. La gente del pueblo va porque los médicos de la salita llegan tarde y no pueden hacer nada."],
   ["¿Qué le propone la mujer a Carla para salvar a David?",
    "Una “migración”: llevar el espíritu de David a otro cuerpo sano. Así la intoxicación se divide entre dos cuerpos y David puede sobrevivir."],
   ["¿Qué precio tiene esa migración?",
    "No se puede saber adónde va el espíritu de David, y al cuerpo de David entra un espíritu desconocido. Carla tiene que aceptar la “nueva forma” de su hijo y seguir siendo responsable de ese cuerpo, pase lo que pase."],
   ["¿Cómo reacciona Carla ante el “nuevo” David?",
    "No lo abraza ni lo toca; se echa hacia atrás. Al final de su relato lo llama “este monstruo”."],
   ["¿Quién es, entonces, el David que habla con Amanda en la cama?",

  gram:{ title:"Estilo indirecto en pasado",

const INTRO = `
<h4>La autora</h4>
<p><strong>Samanta Schweblin</strong> nació en Buenos Aires en 1978 y vive en Berlín. Es una de las escritoras latinoamericanas más leídas y traducidas de hoy. Empezó como cuentista (<em>Pájaros en la boca</em>, <em>Siete casas vacías</em>); <em>Distancia de rescate</em> es su primera novela. En su literatura todo parece normal, pero algo no encaja: lo inquietante aparece en lo cotidiano, en la familia, en el cuerpo.</p>
<h4>El libro</h4>
<p>Amanda pasa unas vacaciones con su hija Nina en un pueblo del campo argentino. Allí conoce a Carla, una vecina, y a su hijo David, un chico que a Carla le da miedo. Es una novela corta, tensa y difícil de soltar: se lee como un relato de terror, pero habla de temas muy reales.</p>
<p class="note">La traducción al inglés, <em>Fever Dream</em>, fue finalista del Man Booker International (2017). En 2021 Claudia Llosa la llevó al cine para Netflix.</p>
<h4>Cómo leerlo</h4>
<p>La novela es casi toda un diálogo entre dos voces, sin rayas.</p>
<div class="voices">
  <div><span class="who">David · en cursiva</span><em>Son como gusanos.</em></div>
  <div><span class="who">Amanda · letra normal</span>¿Qué tipo de gusanos?</div>
</div>
<p>Al principio desorienta: es a propósito. El libro usa el español del Río de la Plata (<em>vos sabés, contame, seguí</em>); el vocabulario de cada sesión te ayuda.</p>
<h4>Para empezar: el video</h4>
<p>Samanta Schweblin cuenta cuál fue su “primer gran amor literario”. Míralo y piensa: ¿qué libro, película o serie te marcó a ti?</p>
<a class="video" href="${VIDEO}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span>Mi primer gran amor literario<small>YouTube · 1:15</small></span></a>`;

const ans = (quote, expl, why) => `<div class="ans"><blockquote>“${quote}”</blockquote><p>${expl}</p>${why ? `<p class="why"><b>Clave:</b> ${why}</p>` : ""}</div>`;
const tog = `<span class="hint"><span class="closed">Intenta responder · toca para ver la respuesta</span><span class="opened">Ocultar</span></span>`;

function readingBox(s) {
  return `<div class="reading-box">
    <div class="top"><strong>Qué leer</strong><span class="pct">${s.from}–${s.to}% del libro</span></div>
    <div><span class="lbl">Empieza</span> <em>${s.n === 1 ? "en la primera línea: " : ""}“${s.start}”</em></div>
    <div><span class="lbl">Termina</span> <em>“${s.end}”</em></div>
    <div class="hintline">${s.endHint}</div>
  </div>`;
}

    <div class="txt">
      <p class="eyebrow">Antes de empezar</p>
      <h2>La novela y su autora</h2>
      <p><strong>Samanta Schweblin</strong> nació en Buenos Aires (Argentina) en 1978 y vive en Berlín. Primero escribió cuentos, como sus autores favoritos (lo explica en el video de la sesión 1). Hoy sus libros están traducidos a más de cuarenta idiomas.</p>
      <p><em>Distancia de rescate</em> es su primera novela. Amanda y su hija Nina pasan unos días de vacaciones en un pueblo, en el campo. Allí conocen a Carla, una vecina muy bonita con un secreto, y a David, el hijo de Carla. Carla tiene miedo de su hijo.</p>
      <p>La novela no empieza como otras: empieza casi por el final, con Amanda enferma en una cama. El libro es corto (unas 120 páginas). Es una historia de terror, pero habla de un problema real.</p>
    </div>
  </div>
  <div class="ready">
    <h3>Ahora sí, a empezar</h3>
    <p>El club tiene 8 sesiones. En cada una lees una parte del libro, con ayuda: palabras importantes, preguntas para comprobar que entendiste y un poco de gramática. Después, lo hablamos en clase.</p>
    <p>En la sesión 1 vas a aprender a leer este libro: dónde estás, quién habla y qué palabras necesitas. ¡Empecemos!</p>
    <div><button class="btn" id="go1">Empezar la sesión 1</button></div>
  </div>`;
const KEY = "club-dr-progress";
let state = { done: 0, current: 0, teacher: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const unlocked = n => true;

function renderKnots() {
  const ol = document.getElementById("knots"); ol.innerHTML = "";
  [{ n: 0, title: "La novela y su autora", to: "Inicio" }].concat(S).forEach(s => {
    const li = document.createElement("li");
    const cls = ["knot", s.n > 0 && s.n <= state.done ? "done" : "open"];
    if (s.n === state.current) cls.push("current");
    li.className = cls.join(" ");
    const b = document.createElement("button");
    b.textContent = s.n; b.id = "knot" + s.n;
    b.setAttribute("aria-label", s.n === 0 ? "Inicio: la novela y su autora" : `Sesión ${s.n}: ${s.title}${s.n <= state.done ? " (leída)" : ""}`);
    b.onclick = () => { if (unlocked(s.n)) { state.current = s.n; save(); render(); } };
    const sp = document.createElement("span"); sp.textContent = s.n === 0 ? s.to : s.to + "%";
    li.append(b, sp); ol.append(li);
  });
  const pct = Math.min(state.done, 8) / 8 * 88.88;
  document.getElementById("fill").style.width = pct + "%";
}

function vocabTable(v) {
  return `<div class="tbl"><table><thead><tr><th>Palabra</th><th>Significado</th><th>English</th></tr></thead><tbody>${
    v.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="en">${r[2]}</td></tr>`).join("")}</tbody></table></div>`;
}
const qa = (q, a) => `<details><summary>${q}<span class="hint"><span class="closed">Intenta responder · toca para ver la respuesta</span><span class="opened">Ocultar respuesta</span></span></summary><div class="ans"><p>${a}</p></div></details>`;

function renderSession() {
  const main = document.getElementById("session");
  if (state.current === 0) { main.innerHTML = S0; document.getElementById("go1").onclick = () => { state.current = 1; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }; return; }
  const s = S[state.current - 1];
  if (!unlocked(s.n)) { main.innerHTML = `<div class="lockedview"><h2>Sesión ${s.n}</h2><p>Se desbloquea cuando termines la sesión anterior.</p></div>`; return; }
  if (V2[s.n]) { main.innerHTML = renderV2(s, V2[s.n]) + nextBlock(s); bindNext(s); return; }
  const g = s.gram;
  main.innerHTML = `<p class="oldnote">Esta sesión todavía está en la versión anterior.</p>
  <div class="session-head">
    <p class="eyebrow">Sesión ${s.n} de 8</p>
    <h2>Parte ${s.n}: ${s.title}</h2>
    ${s.hook ? `<p class="lead">${s.hook}</p>` : ""}
    ${readingBox(s)}
  </div>
  <nav class="parts" aria-label="Partes de la sesión">
    ${s.intro ? '<a href="#p-intro">Introducción</a>' : ""}${s.recap ? '<a href="#p-antes">Antes de leer</a>' : ""}<a href="#p-vocab">Vocabulario</a><a href="#p-qs">Preguntas de lectura</a><a href="#p-gram">Foco gramatical</a>
  </nav>
  ${s.intro ? `<section class="part" id="p-intro"><h3>Antes de leer</h3>${INTRO}</section>` : ""}
  ${s.recap ? `<section class="part" id="p-antes"><h3>Antes de leer</h3><div class="recap"><b>En la sesión anterior</b>${s.recap}</div></section>` : ""}
  <section class="part" id="p-vocab"><h3>Vocabulario</h3>${vocabTable(s.vocab)}</section>
  <section class="part" id="p-qs"><h3>Preguntas de lectura</h3>
    <p class="note">No es un examen: son preguntas para comprobar que entendiste lo fundamental. Intenta responder y después abre la respuesta.</p>
    <div class="qs">${s.qs.map(q => qa(q[0], q[1])).join("")}</div></section>
  <section class="part" id="p-gram"><h3>Foco gramatical</h3>
    <div class="gram"><h4 style="margin-top:0">${g.title}</h4><p>${g.expl}</p>
      ${g.ex.map(e => `<div class="ex"><p><em>${e[0]}</em></p><p class="arrow">${e[1]}</p></div>`).join("")}
      <p class="note" style="margin-top:1rem;margin-bottom:.3rem">Practica:</p>
      <div class="practice">${g.practice.map(p => qa(p[0], p[1])).join("")}</div>
    </div></section>
  ` + nextBlock(s);
  bindNext(s);
}
function nextBlock(s) { return `
  <div class="unlock">
    ${s.n < 8
      ? `<p>${s.n <= state.done ? `Ya terminaste esta sesión.` : `¿Terminaste la lectura? Márcala y pasa a la sesión ${s.n + 1}.`}</p>
         <button class="btn" id="next">${s.n <= state.done ? `Ir a la sesión ${s.n + 1}` : "Terminé esta lectura"}</button>`
      : `<p>${state.done >= 8 ? "Terminaste el libro." : "Última sesión: ¿llegaste al final del libro?"}</p><button class="btn" id="next" ${state.done >= 8 ? "disabled" : ""}>${state.done >= 8 ? "Libro terminado" : "Terminé el libro"}</button>`}
  </div>`;
}
function bindNext(s) {
  const nb = document.getElementById("next");
  if (nb) nb.onclick = () => {
    state.done = Math.max(state.done, s.n);
    if (s.n < 8) state.current = s.n + 1;
    save(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
  };
}

function render() { renderKnots(); renderSession(); }
render();
</script>
